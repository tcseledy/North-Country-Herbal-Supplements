<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home - North Country's Herbal Supplements</title>
 
  <!-- SECURITY: Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
             style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
             img-src 'self' data:;
             connect-src 'self';
             frame-ancestors 'none';">
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
 
  <nav class="site-nav">
    <div class="storefront-container d-flex justify-content-between align-items-center w-100 py-0">
      <a href="home.html" class="logo-link">North Country's Herbal Supplements</a>
      <div id="navbar-controls" class="d-flex align-items-center gap-2">
        </div>
    </div>
  </nav>
 
  <main>
    <div class="storefront-container pt-0">
      <div class="product-grid">
 
        <div class="product-card" onclick="openProductModal(event, 'Organic Ashwagandha')">
          <div class="product-icon">🌿</div>
          <h3>Organic Ashwagandha</h3>
          <div class="price">$1.00</div>
          <button class="add-to-cart-btn" onclick="handleInlineAddToCart(event, 'Organic Ashwagandha', 1.00)">Add to Cart</button>
        </div>
 
        <div class="product-card" onclick="openProductModal(event, 'Lion\'s Mane Extract')">
          <div class="product-icon">🍄</div>
          <h3>Lion's Mane Extract</h3>
          <div class="price">$1.00</div>
          <button class="add-to-cart-btn" onclick="handleInlineAddToCart(event, 'Lion\'s Mane Extract', 1.00)">Add to Cart</button>
        </div>
 
        <div class="product-card" onclick="openProductModal(event, 'Herbal Sleep Tea Blend')">
          <div class="product-icon">🍵</div>
          <h3>Herbal Sleep Tea Blend</h3>
          <div class="price">$1.00</div>
          <button class="add-to-cart-btn" onclick="handleInlineAddToCart(event, 'Herbal Sleep Tea Blend', 1.00)">Add to Cart</button>
        </div>
 
        <div class="product-card" onclick="openProductModal(event, 'Raw Local Propolis')">
          <div class="product-icon">🐝</div>
          <h3>Raw Local Propolis</h3>
          <div class="price">$1.00</div>
          <button class="add-to-cart-btn" onclick="handleInlineAddToCart(event, 'Raw Local Propolis', 1.00)">Add to Cart</button>
        </div>
 
      </div>
    </div>
 
    <div id="product-modal" class="modal fade" window-filter="disabled" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center p-4 border-0 rounded-4 shadow-lg">
          <div class="d-flex justify-content-end">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div id="modal-icon" class="display-3 my-2">🌿</div>
          <h2 id="modal-title" class="text-dark fw-bold h4 mb-2">Product Title</h2>
          <p id="modal-price" class="fw-bold fs-5 my-2" style="color: #6c63ff;">$0.00</p>
          <p id="modal-description" class="text-muted small lh-base my-3">Product description goes here.</p>
          <div id="modal-action-container"></div>
        </div>
      </div>
    </div>
  </main>
 
  <footer>
    © 2026 Theo Cseledy - North Country's Herbal Supplements
  </footer>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
  <script>
    // SECURITY: Escape all user-controlled strings before inserting into innerHTML
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
    }
 
    if (!localStorage.getItem('user_cart')) {
      localStorage.setItem('user_cart', JSON.stringify([]));
    }
 
    const PRODUCT_DETAILS = {
      "Organic Ashwagandha": { icon: "🌱", price: 1.00, desc: "A powerful adaptogenic herb sourced natively to help your body manage stress, stabilize mood, balance cortisol parameters, and enhance absolute daily stamina levels naturally." },
      "Lion's Mane Extract": { icon: "🍄", price: 1.00, desc: "Premium wood-grown fungal extract formula designed specifically to maximize cognitive neurological performance, support brain cell regeneration, and clear chronic mental fog." },
      "Herbal Sleep Tea Blend": { icon: "🍵", price: 1.00, desc: "A calming, caffeine-free infusion of organic chamomile, valerian root, and lavender fields formulated to transition your mind smoothly into deep, restorative REM sleep cycles." },
      "Raw Local Propolis": { icon: "🐝", price: 1.00, desc: "Pure resinous hive extraction packed full of natural antioxidant flavonoids to fortify immune defense mechanisms and accelerate biological recovery speeds." }
    };
 
    let bootstrapModalInstance = null;
 
    function syncNavbarState() {
      const navContainer = document.getElementById("navbar-controls");
      if (!navContainer) return;
 
      const loggedUser = window.currentUser;
 
      if (loggedUser) {
        // SECURITY: escapeHtml on loggedUser.name
        navContainer.innerHTML = `
          <span class="user-greeting">Hi, ${escapeHtml(loggedUser.name)}</span>
          <a href="index.html" class="login">Checkout</a>
          <a href="#" class="login" onclick="logoutUser(); return false;">Log-out</a>
        `;
      } else {
        navContainer.innerHTML = `
          <a href="index.html" class="login">Checkout</a>
          <a href="login.html" class="login">Log-in</a>
          <a href="signup.html" class="signup">Sign-up</a>
        `;
      }
    }
 
    function logoutUser() {
      fetch('/api/logout', { method: 'POST' }).finally(() => window.location.reload());
    }
 
    function addToCart(itemName, itemPrice) {
      // SECURITY: validate against trusted catalog — ignore unknown products
      const product = PRODUCT_DETAILS[itemName];
      if (!product) return;
 
      let currentCart = [];
      try {
        currentCart = JSON.parse(localStorage.getItem('user_cart')) || [];
      } catch (e) {
        currentCart = [];
      }
      // SECURITY: use catalog price, not the price passed in from the DOM
      currentCart.push({ name: itemName, price: product.price });
      localStorage.setItem('user_cart', JSON.stringify(currentCart));
      alert(`Added ${itemName} to your cart!`);
    }
 
    function handleInlineAddToCart(e, itemName, itemPrice) {
      e.stopPropagation();
      addToCart(itemName, itemPrice);
    }
 
    function openProductModal(e, productName) {
      e.stopPropagation();
      const item = PRODUCT_DETAILS[productName];
      if (!item) return;
 
      // SECURITY: product data is from a trusted const — but use textContent to be safe
      document.getElementById("modal-icon").textContent        = item.icon;
      document.getElementById("modal-title").textContent       = productName;
      document.getElementById("modal-price").textContent       = `$${item.price.toFixed(2)}`;
      document.getElementById("modal-description").textContent = item.desc;
 
      const actionContainer = document.getElementById("modal-action-container");
      actionContainer.innerHTML = `<button class="pay-btn" id="modal-submit-btn">Add to Cart - $${item.price.toFixed(2)}</button>`;
 
      document.getElementById("modal-submit-btn").onclick = function(btnEvent) {
        btnEvent.stopPropagation();
        addToCart(productName, item.price);
        if (bootstrapModalInstance) bootstrapModalInstance.hide();
      };
 
      if (bootstrapModalInstance) {
        bootstrapModalInstance.show();
      }
    }
 
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const state = await fetch('/api/session').then(response => response.json());
        window.currentUser = state.authenticated ? state.user : null;
      } catch { window.currentUser = null; }
      syncNavbarState();
 
      const modalEl = document.getElementById("product-modal");
      if (modalEl) {
        bootstrapModalInstance = new bootstrap.Modal(modalEl);
      }
    });
  </script>
</body>
</html>
